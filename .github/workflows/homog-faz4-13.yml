name: Homogenization phase 4 check of 13 events (analysis only)
on:
  push:
    branches: [homog-faz0]
    paths: ['analysis/homog_faz4/dogrulama_13.py', '.github/workflows/homog-faz4-13.yml']
permissions:
  contents: write
jobs:
  run:
    if: github.ref == 'refs/heads/homog-faz0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python analysis/homog_faz4/dogrulama_13.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/homog_faz4/out/dogrulama_13.json; git diff --cached --quiet && exit 0
          git commit -m "Faz 4: 13 olay ISC doğrulaması ($(date -u +%Y-%m-%dT%H:%MZ))"; git pull --rebase origin homog-faz0; git push origin HEAD:homog-faz0
