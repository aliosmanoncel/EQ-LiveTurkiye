name: b güven aralığı (Tinti & Mulargia / χ² / ?bci=normal)

# Aralık çekirdeği scipy referanslarıyla, seçim kuralı ve büyük-N kapsama denetimi (test_b_ci.js);
# aralığı kullanan b(t) testleri hem varsayılan kipte hem eski ±1,96·b/√N kipinde (BCI=normal) çalıştırılır.
on:
  push:
    paths:
      - 'index.html'
      - 'scripts/test_b_ci.js'
      - 'scripts/test_bt_adaptive.js'
      - 'scripts/test_mc_grid.js'
      - 'scripts/test_bt_window.js'
      - '.github/workflows/b-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aralık çekirdeği ve seçim kuralı
        run: node scripts/test_b_ci.js
      - name: b(t) ve Mc–ızgara testleri (varsayılan kip)
        run: node scripts/test_bt_adaptive.js && node scripts/test_mc_grid.js
      - name: Seçilebilir b(t) penceresi (N = 100/50/30/20)
        run: node scripts/test_bt_window.js
      - name: b(t) ve Mc–ızgara testleri (eski kip, ?bci=normal)
        run: BCI=normal node scripts/test_bt_adaptive.js && BCI=normal node scripts/test_mc_grid.js
